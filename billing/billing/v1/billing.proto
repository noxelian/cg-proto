syntax = "proto3";

package billing.billing.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/4ubak/cg-proto/gen/go/billing/billing;billingv1";

// BillingService handles financial accounting: ledger entries, org balances,
// payouts, reconciliation, revenue reporting, and user spending history.
// Consumes events from cg-payments, cg-orders, cg-booking, cg-workshop via Kafka.
service BillingService {
  // === Ledger ===
  rpc RecordLedgerEntry(RecordLedgerEntryRequest) returns (RecordLedgerEntryResponse);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);

  // === Org balances ===
  rpc GetOrgBalance(GetOrgBalanceRequest) returns (GetOrgBalanceResponse);

  // === Payouts ===
  rpc InitiatePayout(InitiatePayoutRequest) returns (InitiatePayoutResponse);
  rpc GetPayoutHistory(GetPayoutHistoryRequest) returns (GetPayoutHistoryResponse);

  // === Reconciliation ===
  rpc ReconcileTransaction(ReconcileTransactionRequest) returns (ReconcileTransactionResponse);

  // === Reporting ===
  rpc GetOrgStatement(GetOrgStatementRequest) returns (GetOrgStatementResponse);
  rpc GetRevenueStats(GetRevenueStatsRequest) returns (GetRevenueStatsResponse);

  // === User / dual-subject spending ===

  // GetStatement returns cursor-paginated ledger entries for any subject
  // (user or organization). Use this for "my spending history" on mobile and
  // "org earnings statement" on web.
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);

  // GetUserBalance returns aggregate spending totals for a user.
  rpc GetUserBalance(GetUserBalanceRequest) returns (GetUserBalanceResponse);

  // ListSpending returns enriched spending entries for a user: each entry
  // includes entity_type, entity_id, amount, currency, and a counterparty_name
  // resolved from upstream services. Intended for the mobile "spending feed".
  rpc ListSpending(ListSpendingRequest) returns (ListSpendingResponse);

  // === User wallet (bonus/cashback balance) ===

  // GetWalletBalance returns the user's deductible bonus/cashback balance.
  rpc GetWalletBalance(GetWalletBalanceRequest) returns (GetWalletBalanceResponse);

  // DebitWallet subtracts amount from the user's bonus wallet. Idempotent on
  // idempotency_key. Called by cg-payments StartPayment before the provider call.
  rpc DebitWallet(DebitWalletRequest) returns (DebitWalletResponse);

  // CreditWallet adds bonus/cashback to the user's wallet. Idempotent on
  // idempotency_key. Called by the payment_confirmed Kafka consumer.
  rpc CreditWallet(CreditWalletRequest) returns (CreditWalletResponse);

  // === Org balance credit (insurance orders / manual) ===

  // CreditOrgBalance credits an organization's available balance directly
  // (insurance-order payout or manual adjustment). Idempotent on idempotency_key.
  rpc CreditOrgBalance(CreditOrgBalanceRequest) returns (CreditOrgBalanceResponse);

  // CreditInsuranceOrder resolves organization and amount from the request/bid
  // owners, then credits the durable billing ledger exactly once per request.
  rpc CreditInsuranceOrder(CreditInsuranceOrderRequest) returns (CreditInsuranceOrderResponse);

  // GetInsuranceOrderCreditStatus returns billing-owned state for one request.
  rpc GetInsuranceOrderCreditStatus(GetInsuranceOrderCreditStatusRequest) returns (GetInsuranceOrderCreditStatusResponse);

  // === Org payout cards (partners_pay) ===

  // InitiateOrgCardBinding starts a card-binding flow and returns a redirect URL.
  rpc InitiateOrgCardBinding(InitiateOrgCardBindingRequest) returns (InitiateOrgCardBindingResponse);

  // ConfirmOrgCardBinding finalizes a card binding after the provider callback.
  rpc ConfirmOrgCardBinding(ConfirmOrgCardBindingRequest) returns (ConfirmOrgCardBindingResponse);

  // ListOrgCards returns an organization's payout cards.
  rpc ListOrgCards(ListOrgCardsRequest) returns (ListOrgCardsResponse);

  // DeleteOrgCard soft-deletes a payout card (status -> "deleted").
  rpc DeleteOrgCard(DeleteOrgCardRequest) returns (DeleteOrgCardResponse);

  // === Escrow delivery and disputes ===

  // DeclareEscrowWork marks the service as delivered. Only an authenticated
  // member of the recipient organization may call it.
  rpc DeclareEscrowWork(DeclareEscrowWorkRequest) returns (DeclareEscrowWorkResponse);

  // ConfirmEscrowDelivery confirms delivery and releases the escrowed amount.
  // Only the authenticated payer may call it; service identities are forbidden.
  // Request/bid escrow additionally requires a one-time, expiring challenge
  // bound server-side to payer + deal + amount + this exact action.
  rpc ConfirmEscrowDelivery(ConfirmEscrowDeliveryRequest) returns (ConfirmEscrowDeliveryResponse);

  // StartEscrowReleaseChallenge sends the protected confirmation challenge to
  // the authenticated payer's verified contact. The server resolves the payer
  // and amount from the immutable deal snapshot; callers cannot supply either.
  rpc StartEscrowReleaseChallenge(StartEscrowReleaseChallengeRequest) returns (StartEscrowReleaseChallengeResponse);

  // AdminConfirmEscrowDelivery confirms delivery on behalf of the payer. Only
  // the canonical cg-bff admin caller with a human admin identifier may call it.
  rpc AdminConfirmEscrowDelivery(AdminConfirmEscrowDeliveryRequest) returns (AdminConfirmEscrowDeliveryResponse);

  // OpenEscrowDispute freezes ordinary settlement and opens a dispute. Only the
  // authenticated payer may call it. No elapsed-time path releases escrow.
  rpc OpenEscrowDispute(OpenEscrowDisputeRequest) returns (OpenEscrowDisputeResponse);

  // ReleaseEscrowAdvance pays the recipient part of a held deal before the
  // work is confirmed. Only the canonical cg-bff admin caller with a human
  // admin identifier may call it. Servers may refuse it for entity types whose
  // policy requires protected confirmation first.
  rpc ReleaseEscrowAdvance(ReleaseEscrowAdvanceRequest) returns (ReleaseEscrowAdvanceResponse);

  // SettleEscrowDispute resolves a dispute by either fully releasing the
  // remaining amount or fully returning it. Split settlement is not supported.
  // Only the canonical cg-bff admin caller with a human admin identifier may
  // call it.
  rpc SettleEscrowDispute(SettleEscrowDisputeRequest) returns (SettleEscrowDisputeResponse);

  // GetEscrowDeal returns one deal. Only its payer, a member of its recipient
  // organization, or an authorized admin may call it.
  rpc GetEscrowDeal(GetEscrowDealRequest) returns (GetEscrowDealResponse);

  // ListOrganizationEscrowDeals returns deals for an organization. Only a
  // verified member of that organization or an authorized admin may call it.
  rpc ListOrganizationEscrowDeals(ListOrganizationEscrowDealsRequest) returns (ListOrganizationEscrowDealsResponse);

  // ListEscrowDeals is the global operational queue. It is service-token only;
  // the admin BFF authenticates and authorizes the human platform administrator
  // before adapting this projection.
  rpc ListEscrowDeals(ListEscrowDealsRequest) returns (ListEscrowDealsResponse);

  // ListPayerEscrowDeals returns the authenticated payer's safe-payment
  // history. The service derives and verifies payer identity from the JWT;
  // service identities may provide payer_user_id for admin/internal adapters.
  rpc ListPayerEscrowDeals(ListPayerEscrowDealsRequest) returns (ListPayerEscrowDealsResponse);

  // BindEscrowPerformer names the organization that will receive a deal whose
  // performer was still unknown when the payer paid.
  //
  // Dispatched work (roadside assistance and other fixed-price services) is
  // paid up front and only then offered to performers, so the hold cannot name
  // a recipient at capture time. The owner service calls this once the order is
  // assigned. Binding is single-shot: a deal that already names an organization
  // rejects a second call, and a deal can never settle while unbound.
  rpc BindEscrowPerformer(BindEscrowPerformerRequest) returns (BindEscrowPerformerResponse);
}

// =============================================
// Enums
// =============================================

enum LedgerEntryType {
  LEDGER_ENTRY_TYPE_UNSPECIFIED = 0;
  LEDGER_ENTRY_TYPE_PAYMENT_RECEIVED = 1; // buyer paid
  LEDGER_ENTRY_TYPE_COMMISSION_EARNED = 2; // platform commission
  LEDGER_ENTRY_TYPE_SELLER_CREDIT = 3; // credit to seller balance
  LEDGER_ENTRY_TYPE_ESCROW_HOLD = 4; // funds held in escrow
  LEDGER_ENTRY_TYPE_ESCROW_RELEASE = 5; // escrow released to seller
  LEDGER_ENTRY_TYPE_ESCROW_RETURN = 6; // escrow returned to buyer
  LEDGER_ENTRY_TYPE_REFUND = 7; // refund to buyer
  LEDGER_ENTRY_TYPE_PAYOUT = 8; // payout to seller
  LEDGER_ENTRY_TYPE_SUBSCRIPTION_PAYMENT = 9; // subscription charge
  LEDGER_ENTRY_TYPE_BOOKING_PAYMENT = 10; // booking charge
  LEDGER_ENTRY_TYPE_ADJUSTMENT = 11; // manual adjustment
  LEDGER_ENTRY_TYPE_REPAIR_ORDER_PAYMENT = 12; // repair order payment
  LEDGER_ENTRY_TYPE_WALLET_DEBIT = 13; // user wallet drawn down for payment
  LEDGER_ENTRY_TYPE_WALLET_CREDIT = 14; // bonus/cashback credited to user wallet
}

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING = 1;
  PAYOUT_STATUS_PROCESSING = 2;
  PAYOUT_STATUS_COMPLETED = 3;
  PAYOUT_STATUS_FAILED = 4;
  PAYOUT_STATUS_CANCELLED = 5;
}

enum ReconciliationStatus {
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_STATUS_MATCHED = 1;
  RECONCILIATION_STATUS_MISMATCHED = 2;
  RECONCILIATION_STATUS_MISSING = 3;
  RECONCILIATION_STATUS_DUPLICATE = 4;
}

enum SubjectType {
  SUBJECT_TYPE_UNSPECIFIED = 0;
  SUBJECT_TYPE_USER = 1;
  SUBJECT_TYPE_ORGANIZATION = 2;
}

// EscrowDealState mirrors the durable escrow_deals state constraint.
enum EscrowDealState {
  ESCROW_DEAL_STATE_UNSPECIFIED = 0;
  ESCROW_DEAL_STATE_HELD = 1;
  ESCROW_DEAL_STATE_WORK_DECLARED = 2;
  ESCROW_DEAL_STATE_DISPUTED = 3;
  ESCROW_DEAL_STATE_PARTIALLY_SETTLED = 4;
  ESCROW_DEAL_STATE_RELEASED = 5;
  ESCROW_DEAL_STATE_RETURNED = 6;
  ESCROW_DEAL_STATE_SETTLED = 7;
}

// =============================================
// Core messages
// =============================================

// LedgerEntry represents a double-entry accounting record.
// Every financial operation creates a debit + credit pair that must balance.
message LedgerEntry {
  int64 id = 1;
  LedgerEntryType entry_type = 2;
  string debit_account = 3; // e.g. "user:123", "platform:commission", "escrow:order:456"
  string credit_account = 4; // e.g. "seller:org_abc", "platform:revenue"
  int64 amount = 5;
  string currency = 6;
  string entity_type = 7; // "order", "subscription", "booking", "bid_purchase", "repair_order"
  int64 entity_id = 8;
  string organization_id = 9;
  string description = 10;
  string idempotency_key = 11;
  google.protobuf.Timestamp created_at = 12;
  SubjectType subject_type = 13;
  int64 subject_id = 14;
}

// OrgBalance represents the current financial state of an organization.
message OrgBalance {
  string organization_id = 1;
  int64 available_balance = 2; // withdrawable amount
  int64 pending_balance = 3; // in escrow, not yet released
  int64 held_balance = 4; // payout in progress
  int64 total_earned = 5; // lifetime earnings
  int64 total_paid_out = 6; // lifetime payouts
  int64 total_commission_paid = 7; // lifetime commission to platform
  string currency = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// UserBalance holds aggregate spending totals for a user.
message UserBalance {
  int64 user_id = 1;
  int64 total_spent_kzt = 2;
  int64 total_refunded_kzt = 3;
  google.protobuf.Timestamp last_transaction_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string currency = 6;
}

// UserWallet holds a user's bonus/cashback balance, distinct from the cumulative
// spending tracked by UserBalance.
message UserWallet {
  int64 user_id = 1;
  int64 balance_tiyn = 2; // current deductible bonus balance
  string currency = 3; // "KZT"
  google.protobuf.Timestamp updated_at = 4;
}

message Payout {
  int64 id = 1;
  string organization_id = 2;
  int64 amount = 3;
  string currency = 4;
  PayoutStatus status = 5;
  string bank_account = 6; // masked, e.g. "****1234"
  string bank_name = 7;
  string reference_number = 8;
  string failure_reason = 9;
  google.protobuf.Timestamp requested_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message RevenueDataPoint {
  string period = 1;
  int64 total_amount = 2;
  int64 subscription_amount = 3;
  int64 bid_purchase_amount = 4;
  int64 order_amount = 5;
  int64 booking_amount = 6;
  int64 commission_amount = 7;
  int64 refund_amount = 8;
  string currency = 9;
}

// SpendingEntry is a single enriched spending record shown to the user.
message SpendingEntry {
  int64 id = 1;
  string entity_type = 2; // "order", "subscription", "booking", "repair_order"
  int64 entity_id = 3;
  int64 amount = 4;
  string currency = 5;
  string counterparty_name = 6; // org/workshop name resolved by BFF; empty if unresolvable
  string status = 7; // "succeeded", "refunded", etc. — informational only
  string description = 8;
  google.protobuf.Timestamp created_at = 9;
  LedgerEntryType entry_type = 10;
}

// =============================================
// Ledger RPCs
// =============================================

message RecordLedgerEntryRequest {
  LedgerEntryType entry_type = 1;
  string debit_account = 2;
  string credit_account = 3;
  int64 amount = 4;
  string currency = 5;
  string entity_type = 6;
  int64 entity_id = 7;
  string organization_id = 8;
  string description = 9;
  string idempotency_key = 10;
  SubjectType subject_type = 11;
  int64 subject_id = 12;
}

message RecordLedgerEntryResponse {
  LedgerEntry entry = 1;
}

message ListLedgerEntriesRequest {
  string organization_id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  LedgerEntryType entry_type = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
  int32 total = 2;
}

// =============================================
// Org balance RPCs
// =============================================

message GetOrgBalanceRequest {
  string organization_id = 1;
}

message GetOrgBalanceResponse {
  OrgBalance balance = 1;
}

// =============================================
// Payout RPCs
// =============================================

message InitiatePayoutRequest {
  string organization_id = 1;
  int64 amount = 2;
  string currency = 3;
  string bank_account = 4;
  string bank_name = 5;
  string idempotency_key = 6;
  optional string provider = 7; // "" = ledger-only/default, "partners_pay"
  optional string card_id = 8; // OrgPayoutCard.id when provider = "partners_pay"
}

message InitiatePayoutResponse {
  Payout payout = 1;
}

message GetPayoutHistoryRequest {
  string organization_id = 1;
  PayoutStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetPayoutHistoryResponse {
  repeated Payout payouts = 1;
  int32 total = 2;
}

// =============================================
// Reconciliation RPCs
// =============================================

message ReconcileTransactionRequest {
  int64 transaction_id = 1;
  string provider = 2;
  string external_id = 3;
  int64 expected_amount = 4;
  int64 actual_amount = 5;
  string currency = 6;
}

message ReconcileTransactionResponse {
  ReconciliationStatus status = 1;
  string details = 2;
}

// =============================================
// Reporting RPCs
// =============================================

message GetOrgStatementRequest {
  string organization_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message GetOrgStatementResponse {
  string organization_id = 1;
  repeated LedgerEntry entries = 2;
  int64 opening_balance = 3;
  int64 closing_balance = 4;
  int64 total_credits = 5;
  int64 total_debits = 6;
  string currency = 7;
}

message GetRevenueStatsRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string group_by = 3; // day, week, month
}

message GetRevenueStatsResponse {
  repeated RevenueDataPoint data_points = 1;
  int64 total_revenue = 2;
  string currency = 3;
}

// =============================================
// User / dual-subject RPCs
// =============================================

message GetStatementRequest {
  SubjectType subject_type = 1;
  int64 subject_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int32 limit = 5;
  // Opaque cursor returned by the previous page. Empty on first call.
  string cursor = 6;
}

message GetStatementResponse {
  repeated LedgerEntry entries = 1;
  int32 total = 2;
  // next_cursor is non-empty when more results are available.
  string next_cursor = 3;
}

message GetUserBalanceRequest {
  int64 user_id = 1;
}

message GetUserBalanceResponse {
  UserBalance balance = 1;
}

message ListSpendingRequest {
  int64 user_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 limit = 4;
  string cursor = 5;
  // Optional: filter to a single entity_type ("subscription", "order", etc.)
  string entity_type = 6;
}

message ListSpendingResponse {
  repeated SpendingEntry entries = 1;
  int32 total = 2;
  string next_cursor = 3;
}

// =============================================
// User wallet RPCs
// =============================================

message GetWalletBalanceRequest {
  int64 user_id = 1;
}

message GetWalletBalanceResponse {
  UserWallet wallet = 1;
}

// DebitWallet subtracts amount from the user's bonus wallet. Idempotent on
// idempotency_key.
message DebitWalletRequest {
  int64 user_id = 1;
  int64 amount_tiyn = 2;
  string entity_type = 3;
  int64 entity_id = 4;
  string idempotency_key = 5;
  string description = 6;
}

message DebitWalletResponse {
  UserWallet wallet_after = 1;
  LedgerEntry ledger_entry = 2;
  bool idempotent = 3;
}

// CreditWallet adds bonus/cashback to the user's wallet. Idempotent on
// idempotency_key.
message CreditWalletRequest {
  int64 user_id = 1;
  int64 amount_tiyn = 2;
  string entity_type = 3;
  int64 entity_id = 4;
  string idempotency_key = 5;
  string description = 6;
}

message CreditWalletResponse {
  UserWallet wallet_after = 1;
  LedgerEntry ledger_entry = 2;
  bool idempotent = 3;
}

// =============================================
// Org balance credit (insurance orders / manual)
// =============================================

message CreditOrgBalanceRequest {
  string organization_id = 1;
  int64 amount = 2; // тиыны, > 0
  string currency = 3; // "KZT"
  string reason_type = 4; // "insurance_order" | "manual"
  string reference_id = 5; // request_id/order_id для сверки, optional
  string comment = 6;
  string idempotency_key = 7; // обязательный
  int64 initiated_by = 8; // admin user id (для аудита)
}

message CreditOrgBalanceResponse {
  int64 available_balance_after = 1;
  bool idempotent_replay = 2;
}

message CreditInsuranceOrderRequest {
  string request_id = 1;
  string idempotency_key = 2;
  int64 initiated_by = 3;
}

message CreditInsuranceOrderResponse {
  string credit_id = 1;
  string organization_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
  google.protobuf.Timestamp credited_at = 5;
  bool idempotent_replay = 6;
}

enum InsuranceOrderCreditState {
  INSURANCE_ORDER_CREDIT_STATE_UNSPECIFIED = 0;
  INSURANCE_ORDER_CREDIT_STATE_NOT_CREDITED = 1;
  INSURANCE_ORDER_CREDIT_STATE_CREDITED = 2;
  INSURANCE_ORDER_CREDIT_STATE_REVERSED_REQUIRES_REVIEW = 3;
}

message GetInsuranceOrderCreditStatusRequest {
  string request_id = 1;
}

message GetInsuranceOrderCreditStatusResponse {
  InsuranceOrderCreditState state = 1;
  string credit_id = 2;
  string organization_id = 3;
  int64 amount_minor = 4;
  string currency = 5;
  google.protobuf.Timestamp credited_at = 6;
}

// =============================================
// Org payout cards (partners_pay)
// =============================================

message OrgPayoutCard {
  string id = 1;
  string organization_id = 2;
  string provider = 3; // "partners_pay"
  string provider_card_id = 4;
  string masked_number = 5;
  string payment_system = 6;
  string status = 7; // "active" | "deleted"
  google.protobuf.Timestamp created_at = 8;
}

message InitiateOrgCardBindingRequest {
  string organization_id = 1;
  string phone = 2;
  string success_url = 3;
  string fail_url = 4;
}

message InitiateOrgCardBindingResponse {
  string binding_url = 1;
  string binding_order_id = 2;
}

message ConfirmOrgCardBindingRequest {
  string organization_id = 1;
  string binding_order_id = 2;
}

message ConfirmOrgCardBindingResponse {
  OrgPayoutCard card = 1;
}

message ListOrgCardsRequest {
  string organization_id = 1;
}

message ListOrgCardsResponse {
  repeated OrgPayoutCard cards = 1;
}

message DeleteOrgCardRequest {
  string organization_id = 1;
  string card_id = 2;
}

message DeleteOrgCardResponse {
  bool deleted = 1;
}

// =============================================
// Escrow delivery and disputes
// =============================================

// EscrowDeal is the immutable hold snapshot plus its cumulative settlement
// state. Every amount is expressed in the currency minor unit.
message EscrowDeal {
  int64 id = 1;
  int64 transaction_id = 2;
  int64 hold_ledger_entry_id = 3;
  string organization_id = 4;
  int64 payer_user_id = 5;
  string entity_type = 6;
  int64 entity_id = 7;
  string provider = 8;
  string currency = 9;
  int64 amount_gross = 10;
  int64 commission_basis_points = 11;
  int64 commission_amount = 12;
  int64 released_total = 13;
  int64 returned_total = 14;
  int64 reserved_returning = 15;
  int64 remaining_amount = 16;
  int64 settlement_sequence = 17;
  EscrowDealState state = 18;
  google.protobuf.Timestamp auto_release_at = 19;
  google.protobuf.Timestamp work_declared_at = 20;
  google.protobuf.Timestamp confirmed_at = 21;
  string confirmed_via = 22;
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
  // Owner-service UUID and numeric response/bid identifier. entity_id remains
  // the payment-system compatibility key and is not a substitute for this pair.
  string request_id = 25;
  int64 bid_id = 26;
  // Monotonic evidence that a successful provider capture entered HELD.
  // It never becomes false after dispute, refund or release.
  bool ever_held = 27;
  string settlement_mode = 28;
  // Immutable policy identifier used to calculate commission at release.
  string commission_policy = 29;
}

message BindEscrowPerformerRequest {
  // The deal is addressed by the payment it was held against, because the
  // owner service knows the transaction it started and never learns the
  // billing-side deal id.
  int64 transaction_id = 1;
  string organization_id = 2;
}

message BindEscrowPerformerResponse {
  EscrowDeal deal = 1;
}

message DeclareEscrowWorkRequest {
  int64 deal_id = 1;
}

message DeclareEscrowWorkResponse {}

message ConfirmEscrowDeliveryRequest {
  int64 deal_id = 1;
  string challenge_id = 2;
  string code = 3;
  string idempotency_key = 4;
}

message ConfirmEscrowDeliveryResponse {}

message AdminConfirmEscrowDeliveryRequest {
  int64 deal_id = 1;
  // Required human administrator identifier for the audit log.
  string admin_id = 2;
  // Required. An empty or whitespace-only reason is invalid.
  string reason = 3;
  // Required communication channel used to verify the payer's confirmation.
  string channel = 4;
  // Required caller-generated key. Retrying the same audited action is safe;
  // reusing it with a different payload is rejected.
  string idempotency_key = 5;
}

message AdminConfirmEscrowDeliveryResponse {}

message OpenEscrowDisputeRequest {
  int64 deal_id = 1;
  // Required. An empty or whitespace-only reason is invalid.
  string reason = 2;
}

message OpenEscrowDisputeResponse {}

// ReleaseEscrowAdvance pays part of a held deal to the recipient before the
// work is confirmed. Server policy decides which entity types allow it.
message ReleaseEscrowAdvanceRequest {
  int64 deal_id = 1;
  string admin_id = 2;
  int64 amount = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message ReleaseEscrowAdvanceResponse {
  EscrowDeal deal = 1;
}

message SettleEscrowDisputeRequest {
  int64 deal_id = 1;
  // Required human administrator identifier for the audit log.
  string admin_id = 2;
  // Either the complete remaining amount or zero.
  int64 release_amount = 3;
  // Either the complete remaining amount or zero.
  int64 return_amount = 4;
  // Required dispute resolution recorded in the audit log.
  string resolution = 5;
  // Required caller-generated key. Reusing it with another settlement payload
  // is rejected; replaying the same committed resolution is safe.
  string idempotency_key = 6;
}

message SettleEscrowDisputeResponse {}

message GetEscrowDealRequest {
  int64 deal_id = 1;
}

message GetEscrowDealResponse {
  EscrowDeal deal = 1;
}

message ListOrganizationEscrowDealsRequest {
  // The service must bind this organization context to verified caller claims
  // unless the caller has explicit administrative access.
  string organization_id = 1;
  EscrowDealState state = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrganizationEscrowDealsResponse {
  repeated EscrowDeal deals = 1;
  int32 total = 2;
}

message ListEscrowDealsRequest {
  // Optional recipient filter. Empty means all organizations.
  string organization_id = 1;
  EscrowDealState state = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListEscrowDealsResponse {
  repeated EscrowDeal deals = 1;
  int32 total = 2;
}

message ListPayerEscrowDealsRequest {
  int64 payer_user_id = 1;
  EscrowDealState state = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListPayerEscrowDealsResponse {
  repeated EscrowDeal deals = 1;
  int32 total = 2;
}

message StartEscrowReleaseChallengeRequest {
  int64 deal_id = 1;
  string idempotency_key = 2;
}

message StartEscrowReleaseChallengeResponse {
  string challenge_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  int32 retry_after_seconds = 3;
  string masked_destination = 4;
}
