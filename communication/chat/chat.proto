syntax = "proto3";

package communication.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/4ubak/cg-proto/gen/go/communication/chat;chatv1";

service ChatService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  rpc GetUserChats(GetUserChatsRequest) returns (GetUserChatsResponse);
  rpc GetOrgChats(GetOrgChatsRequest) returns (GetOrgChatsResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  // DeleteMessage performs a soft-delete of a single message.
  // Returns NOT_FOUND if message_id does not exist in the chat.
  // Returns PERMISSION_DENIED if requester_user_id != message.sender_id.
  // Soft-delete: sets messages.deleted_at = now(), never physical removal.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
}

enum ChatContextType {
  CHAT_CONTEXT_TYPE_UNSPECIFIED = 0;
  CHAT_CONTEXT_TYPE_ORGANIZATION = 1;
  CHAT_CONTEXT_TYPE_REQUEST = 2;
  CHAT_CONTEXT_TYPE_PARTS_ORDER = 3;
  CHAT_CONTEXT_TYPE_WORKSHOP_ORDER = 4;
  CHAT_CONTEXT_TYPE_SUPPORT = 5;
}

// ChatPerspective identifies the authenticated caller's side of a chat.
// BFFs set this routing context from the selected application/profile; chat
// service still verifies the JWT user and organization membership.
enum ChatPerspective {
  CHAT_PERSPECTIVE_UNSPECIFIED = 0;
  CHAT_PERSPECTIVE_BUYER = 1;
  CHAT_PERSPECTIVE_SELLER_ORG = 2;
  CHAT_PERSPECTIVE_SELLER_USER = 3;
  CHAT_PERSPECTIVE_SUPPORT = 4;
}

// ChatApp is the application delivery boundary for realtime chat events.
enum ChatApp {
  CHAT_APP_UNSPECIFIED = 0;
  CHAT_APP_CLIENT = 1;
  CHAT_APP_PRO = 2;
}

// VehicleContextProvenance records which owner projection supplied the
// participant-authorized vehicle snapshot.
enum VehicleContextProvenance {
  VEHICLE_CONTEXT_PROVENANCE_UNSPECIFIED = 0;
  VEHICLE_CONTEXT_PROVENANCE_REQUEST_SNAPSHOT = 1;
  VEHICLE_CONTEXT_PROVENANCE_GARAGE_SNAPSHOT = 2;
  VEHICLE_CONTEXT_PROVENANCE_PARTS_ORDER_SNAPSHOT = 3;
  VEHICLE_CONTEXT_PROVENANCE_WORKSHOP_ORDER_SNAPSHOT = 4;
}

// Chat represents a conversation between a mobile user and a seller/org/support.
// caller_role and caller_unread_count are populated by the server based on
// the authenticated caller's identity relative to this chat.
message Chat {
  string id = 1;
  ChatContextType context_type = 2;
  string context_id = 3;
  int64 buyer_id = 4;
  int64 seller_id = 5;
  string seller_org_id = 6;
  Message last_message = 7;
  int32 unread_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // caller_role is "buyer" or "seller", computed from caller identity.
  string caller_role = 11;
  // caller_unread_count is the unread count for the caller's role.
  int32 caller_unread_count = 12;

  // --- Legacy s_ad enrichment (cg_web parity). Populated server-side from the
  // seller org (cg-users organization) + the chat context entity. Avatar is a
  // RELATIVE path; the BFF prefixes /fs/ before returning to the client. ---
  string counterparty_name = 13; // legacy s_ad.usr_name — seller org/user display name
  string counterparty_avatar = 14; // legacy s_ad.ava — relative path
  string counterparty_address = 15; // legacy s_ad.address — seller org address
  string context_title = 16; // legacy s_ad.note — short title of the ad/service
  int64 context_price = 17; // legacy s_ad.price — tiyins; 0 = unset
  // Split unread counters (legacy client_new_msg_count / server_new_msg_count).
  // Coexist with unread_count(8) and caller_unread_count(12); do not touch those.
  int32 unread_for_buyer = 18; // legacy client_new_msg_count
  int32 unread_for_seller = 19; // legacy server_new_msg_count
  // Caller projection selected by the service after participant and org checks.
  ChatPerspective caller_perspective = 20;
  string caller_organization_id = 21;
  // Omitted when this chat has no vehicle. VIN is populated only for an
  // authorized participant; clients resolve car_make_id to an NSI logo.
  VehicleContext vehicle_context = 22;
  // Bid that originated this chat, when the request response is bid-backed.
  optional int64 origin_bid_id = 23;
}

message Message {
  string id = 1;
  string chat_id = 2;
  int64 sender_id = 3;
  string content = 4;
  string message_type = 5;
  bool is_read = 6;
  google.protobuf.Timestamp created_at = 7;
  // Sender projection resolved by chat service, never trusted as authority.
  ChatPerspective sender_perspective = 8;
  string sender_organization_id = 9;
}

// VehicleContext is a participant-authorized vehicle snapshot for chat and
// request projections. It deliberately stores NSI IDs, not an NSI logo URL.
message VehicleContext {
  optional int64 garage_car_id = 1;
  int64 car_make_id = 2;
  int64 car_model_id = 3;
  optional int64 car_generation_id = 4;
  int32 year = 5;
  // VIN is omitted unless the caller is authorized to see it.
  optional string vin = 6;
  VehicleContextProvenance provenance = 7;
}

// ChatRealtimeEventPayload is the protobuf-owned projection of the
// chat.message.sent realtime event. The explicit recipient boundary allows
// websocket and push consumers to route one phone/user session to the correct
// application and organization without user-only inference.
message ChatRealtimeEventPayload {
  string message_id = 1;
  string chat_id = 2;
  int64 sender_id = 3;
  string message_type = 4;
  int64 recipient_id = 5;
  repeated int64 recipient_user_ids = 6;
  ChatApp recipient_app = 7;
  ChatPerspective recipient_perspective = 8;
  string recipient_organization_id = 9;
  ChatContextType context_type = 10;
  string context_id = 11;
}

message CreateChatRequest {
  ChatContextType context_type = 1;
  string context_id = 2;
  int64 buyer_id = 3;
  int64 seller_id = 4;
  // seller_org_id is the UUID of the seller organization (empty for individual sellers).
  string seller_org_id = 5;
  // For REQUEST chats, context_id is the request UUID and seller_org_id is the
  // responding supplier organization. The service verifies both relationships.
  ChatPerspective perspective = 6;
  string organization_id = 7;
  optional int64 origin_bid_id = 8;
}

message CreateChatResponse {
  Chat chat = 1;
}

message GetChatRequest {
  string chat_id = 1;
  ChatPerspective perspective = 2;
  string organization_id = 3;
}

message GetChatResponse {
  Chat chat = 1;
}

message GetUserChatsRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  ChatPerspective perspective = 4;
  string organization_id = 5;
}

message GetUserChatsResponse {
  repeated Chat chats = 1;
  int32 total = 2;
}

// GetOrgChatsRequest fetches chats for an organization.
// The caller must be a member of the organization (validated via JWT org claim).
message GetOrgChatsRequest {
  string organization_id = 1;
  int32 limit = 2;
  // cursor is the last chat ID for cursor-based pagination.
  string cursor = 3;
  // status filters chats: "open" | "closed" | "all". Defaults to "all".
  string status = 4;
  ChatPerspective perspective = 5;
}

message GetOrgChatsResponse {
  repeated Chat chats = 1;
  // next_cursor is the ID of the last item returned; empty means no more pages.
  string next_cursor = 2;
  int32 total = 3;
}

message SendMessageRequest {
  string chat_id = 1;
  int64 sender_id = 2;
  string content = 3;
  string message_type = 4;
  ChatPerspective perspective = 5;
  string organization_id = 6;
}

message SendMessageResponse {
  Message message = 1;
}

message GetMessagesRequest {
  string chat_id = 1;
  string before_id = 2;
  int32 limit = 3;
  ChatPerspective perspective = 4;
  string organization_id = 5;
}

message GetMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
  // Same participant-authorized snapshot exposed by Chat for message screens.
  VehicleContext vehicle_context = 3;
}

message MarkAsReadRequest {
  string chat_id = 1;
  int64 user_id = 2;
  string last_message_id = 3;
  ChatPerspective perspective = 4;
  string organization_id = 5;
}

message MarkAsReadResponse {
  int32 marked_count = 1;
}

// ============================================================
// B1: DeleteMessage
// ============================================================

// DeleteMessageRequest identifies the message to soft-delete.
// requester_user_id is used for authorship verification:
//   PERMISSION_DENIED when requester_user_id != Message.sender_id.
message DeleteMessageRequest {
  string chat_id = 1;
  string message_id = 2;
  int64 requester_user_id = 3;
  ChatPerspective perspective = 4;
  string organization_id = 5;
}

// DeleteMessageResponse is intentionally empty (maps to HTTP 204 on the BFF side).
message DeleteMessageResponse {}

// AdminChatService provides admin-only RPCs for chat moderation.
// All methods require a valid JWT with platform role "admin" or "support"
// asserted via the x-platform-role gRPC metadata header (set by BFF).
service AdminChatService {
  // AdminGetUserChats returns chats for any user by ID.
  rpc AdminGetUserChats(AdminGetUserChatsRequest) returns (AdminGetUserChatsResponse);

  // AdminGetChatMessages returns messages from any chat by ID.
  rpc AdminGetChatMessages(AdminGetChatMessagesRequest) returns (AdminGetChatMessagesResponse);

  // AdminListChats returns chats filtered by context type — the operator inbox
  // feed (context_type = CHAT_CONTEXT_TYPE_SUPPORT for the support desk).
  // Ordered by last message time, newest first. The operator-side unread count
  // is Chat.unread_for_seller (support chats have no seller).
  rpc AdminListChats(AdminListChatsRequest) returns (AdminListChatsResponse);

  // AdminSendMessage posts an operator reply into any chat. The sender is the
  // admin/support user resolved from the JWT — never taken from the request —
  // and the message ID is generated server-side.
  rpc AdminSendMessage(AdminSendMessageRequest) returns (AdminSendMessageResponse);

  // AdminMarkChatRead resets the operator-side unread counter for the chat.
  rpc AdminMarkChatRead(AdminMarkChatReadRequest) returns (AdminMarkChatReadResponse);
}

message AdminGetUserChatsRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message AdminGetUserChatsResponse {
  repeated Chat chats = 1;
  int32 total = 2;
}

message AdminGetChatMessagesRequest {
  string chat_id = 1;
  string before_id = 2;
  int32 limit = 3;
}

message AdminGetChatMessagesResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}

// AdminListChatsRequest selects the operator inbox slice.
// context_type is required; CHAT_CONTEXT_TYPE_UNSPECIFIED is rejected with
// INVALID_ARGUMENT so an admin can never fan out over every chat by accident.
message AdminListChatsRequest {
  ChatContextType context_type = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message AdminListChatsResponse {
  repeated Chat chats = 1;
  int64 total = 2;
}

// AdminSendMessageRequest carries only the chat and the operator's text.
// sender_id is NOT accepted from the caller — the service takes the admin user
// from the JWT. The message is published to chat.events like any other message,
// so the client receives it over websocket and as an offline push.
message AdminSendMessageRequest {
  string chat_id = 1;
  string text = 2;
}

message AdminSendMessageResponse {
  Message message = 1;
}

// AdminMarkChatReadRequest clears the operator-side unread counter.
message AdminMarkChatReadRequest {
  string chat_id = 1;
}

message AdminMarkChatReadResponse {
  bool success = 1;
}
