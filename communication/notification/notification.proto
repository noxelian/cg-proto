syntax = "proto3";

package communication.notification.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/4ubak/cg-proto/gen/go/communication/notification;notificationv1";

service NotificationService {
  rpc SendPush(SendPushRequest) returns (SendPushResponse);
  rpc SendSMS(SendSMSRequest) returns (SendSMSResponse);
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);
  rpc GetNotificationStreams(GetNotificationStreamsRequest) returns (GetNotificationStreamsResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse);
  rpc UpdateDevice(UpdateDeviceRequest) returns (UpdateDeviceResponse);
  rpc ListUserDevices(ListUserDevicesRequest) returns (ListUserDevicesResponse);
  rpc GetSMSBalance(GetSMSBalanceRequest) returns (GetSMSBalanceResponse);

  // Preferences
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_PUSH = 1;
  NOTIFICATION_TYPE_SMS = 2;
  NOTIFICATION_TYPE_EMAIL = 3;
}

enum NotificationCategory {
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;
  NOTIFICATION_CATEGORY_CHAT = 1;
  NOTIFICATION_CATEGORY_ORDER = 2;
  NOTIFICATION_CATEGORY_PROMO = 3;
  NOTIFICATION_CATEGORY_SYSTEM = 4;
  NOTIFICATION_CATEGORY_JOB = 5;
  // PAYMENT covers transactional payment notifications (charge succeeded,
  // refund, etc.). Treated as critical: not gated by user preferences.
  NOTIFICATION_CATEGORY_PAYMENT = 6;
  // CART covers cart expiry/reminder and checkout lifecycle notifications.
  NOTIFICATION_CATEGORY_CART = 7;
}

// NotificationStream is the customer-facing inbox split. It deliberately
// groups several internal categories while keeping chat notifications out of
// the notification centre because chat has its own conversation list.
enum NotificationStream {
  NOTIFICATION_STREAM_UNSPECIFIED = 0;
  NOTIFICATION_STREAM_ACTIVITY = 1;
  NOTIFICATION_STREAM_PAYMENTS = 2;
  NOTIFICATION_STREAM_NEWS = 3;
}

// NotificationApp is the typed application boundary. PRO maps to the legacy
// device app value "partner" during the additive consumer migration.
enum NotificationApp {
  NOTIFICATION_APP_UNSPECIFIED = 0;
  NOTIFICATION_APP_CLIENT = 1;
  NOTIFICATION_APP_PRO = 2;
}

// NotificationPerspective identifies the recipient profile inside an app.
// Owner services must verify JWT and organization membership before delivery.
enum NotificationPerspective {
  NOTIFICATION_PERSPECTIVE_UNSPECIFIED = 0;
  NOTIFICATION_PERSPECTIVE_BUYER = 1;
  NOTIFICATION_PERSPECTIVE_SELLER_ORG = 2;
  NOTIFICATION_PERSPECTIVE_SELLER_USER = 3;
  NOTIFICATION_PERSPECTIVE_SUPPORT = 4;
}

message Notification {
  string id = 1;
  int64 user_id = 2;
  NotificationType type = 3;
  NotificationCategory category = 4;
  string title = 5;
  string body = 6;
  map<string, string> data = 7;
  bool is_read = 8;
  google.protobuf.Timestamp created_at = 9;
  NotificationApp recipient_app = 10;
  NotificationPerspective recipient_perspective = 11;
  string recipient_organization_id = 12;
  string context_type = 13;
  string context_id = 14;
}

// DeviceInfo is returned by RegisterDevice, UpdateDevice, and ListUserDevices.
message DeviceInfo {
  int64 id = 1;
  int64 user_id = 2;
  string token = 3;
  string platform = 4;
  string app_version = 5;
  string device_model = 6;
  string locale = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  google.protobuf.Timestamp created_at = 9;
  // Typed replacement for the legacy RegisterDeviceRequest.app string.
  NotificationApp app = 10;
}

message SendPushRequest {
  int64 user_id = 1;
  string title = 2;
  string body = 3;
  NotificationCategory category = 4;
  map<string, string> data = 5;
  // One scoped delivery belongs to exactly one application. Campaign fan-out
  // creates separate deliveries per app.
  NotificationApp recipient_app = 6;
  NotificationPerspective recipient_perspective = 7;
  string recipient_organization_id = 8;
  string context_type = 9;
  string context_id = 10;
}

// PushEventPayload is the protobuf-owned projection of notification.push.
// Legacy JSON publishers may omit fields 8-14 during the additive rollout;
// new producers must provide explicit recipient routing instead of inferring
// application or organization solely from user_id.
message PushEventPayload {
  int64 user_id = 1;
  string event_type = 2;
  string title = 3;
  string body = 4;
  map<string, string> data = 5;
  string priority = 6;
  string dedup_key = 7;
  // Legacy multi-app producer target. New producers emit one scoped event and
  // set recipient_app; consumers keep this during the additive migration.
  repeated NotificationApp target_apps = 8;
  NotificationCategory category = 9;
  NotificationApp recipient_app = 10;
  NotificationPerspective recipient_perspective = 11;
  string recipient_organization_id = 12;
  string context_type = 13;
  string context_id = 14;
}

// RealtimeNotificationEventPayload mirrors the notification.new payload sent
// to websocket clients and carries the same explicit recipient boundary.
message RealtimeNotificationEventPayload {
  int64 user_id = 1;
  string id = 2;
  NotificationType type = 3;
  NotificationCategory category = 4;
  string title = 5;
  string body = 6;
  map<string, string> data = 7;
  bool is_read = 8;
  google.protobuf.Timestamp created_at = 9;
  NotificationApp recipient_app = 10;
  NotificationPerspective recipient_perspective = 11;
  string recipient_organization_id = 12;
  string context_type = 13;
  string context_id = 14;
}

message SendPushResponse {
  bool success = 1;
  int32 devices_sent = 2;
}

message SendSMSRequest {
  string phone = 1;
  // Free-form SMS body. Used verbatim when template_code is empty (legacy
  // path / OTP / one-off messages). NOTE: 61-CONTEXT.md D-01 referred to
  // this field as `body`; the live wire name is `message` — we kept it for
  // backward compat, the rename was cosmetic only.
  string message = 2;
  // Optional. When non-empty, cg-communication renders the template registered
  // under this code with template_data and ignores `message` (Phase 61 NTF-01 D-02/D-03).
  string template_code = 3;
  // Optional. Substitution variables for the template referenced by template_code.
  // Keys MUST match Go text/template field accessors (e.g. "PlanName" → {{.PlanName}}).
  // Renderer runs with Option("missingkey=error") so absent keys produce an error,
  // never a `<no value>` placeholder reaching the recipient.
  map<string, string> template_data = 4;
}

message SendSMSResponse {
  bool success = 1;
}

message SendEmailRequest {
  string email = 1;
  string subject = 2;
  string body = 3;
  string template = 4;
  map<string, string> template_data = 5;
}

message SendEmailResponse {
  bool success = 1;
}

message GetNotificationsRequest {
  int64 user_id = 1;
  NotificationCategory category = 2;
  bool unread_only = 3;
  int32 page = 4;
  int32 page_size = 5;
  NotificationStream stream = 6;
  NotificationApp app = 7;
  NotificationPerspective perspective = 8;
  string organization_id = 9;
}

message GetNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total = 2;
}

message NotificationStreamSummary {
  NotificationStream stream = 1;
  Notification latest_notification = 2;
  int32 unread_count = 3;
}

message GetNotificationStreamsRequest {
  int64 user_id = 1;
  NotificationApp app = 2;
  NotificationPerspective perspective = 3;
  string organization_id = 4;
}

message GetNotificationStreamsResponse {
  repeated NotificationStreamSummary streams = 1;
}

message MarkAsReadRequest {
  int64 user_id = 1;
  repeated string notification_ids = 2;
  bool mark_all = 3;
  // When mark_all is true, scopes the bulk action to one customer-facing
  // stream. UNSPECIFIED preserves the legacy all-notifications behavior.
  NotificationStream stream = 4;
  NotificationApp app = 5;
  NotificationPerspective perspective = 6;
  string organization_id = 7;
}

message MarkAsReadResponse {
  int32 marked_count = 1;
}

message GetUnreadCountRequest {
  int64 user_id = 1;
  NotificationApp app = 2;
  NotificationPerspective perspective = 3;
  string organization_id = 4;
}

message GetUnreadCountResponse {
  int32 count = 1;
}

// RegisterDevice — upsert by (user_id, fcm_token, app).
// fcm_token field carries any push token: FCM registration token or APNs device token.
message RegisterDeviceRequest {
  int64 user_id = 1;
  string device_id = 2; // legacy; prefer using fcm_token as the canonical token
  string fcm_token = 3; // canonical push token for all platforms
  string platform = 4; // "ios" | "android" | "web"
  string app_version = 5;
  string device_model = 6;
  string locale = 7;
  // app identifies which application registered this device: "client" (default) or "partner"
  string app = 8;
  // target_app is the typed form. UNSPECIFIED preserves legacy app handling.
  NotificationApp target_app = 9;
}

message RegisterDeviceResponse {
  bool success = 1;
  DeviceInfo device = 2;
}

message UnregisterDeviceRequest {
  int64 user_id = 1;
  string device_id = 2; // token value (legacy field name kept for compat)
}

message UnregisterDeviceResponse {
  bool success = 1;
}

// UpdateDevice — partial update of device metadata.
message UpdateDeviceRequest {
  int64 user_id = 1;
  string token = 2;
  string app_version = 3;
  string device_model = 4;
  string locale = 5;
}

message UpdateDeviceResponse {
  DeviceInfo device = 1;
}

// ListUserDevices — returns all registered devices for a user.
message ListUserDevicesRequest {
  int64 user_id = 1;
}

message ListUserDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message GetSMSBalanceRequest {}

message GetSMSBalanceResponse {
  bool available = 1;
  double balance = 2;
}

// Preferences
message NotificationPreferences {
  int64 user_id = 1;
  bool push_enabled = 2;
  bool sms_enabled = 3;
  bool email_enabled = 4;
  bool chat_notifications = 5;
  bool order_notifications = 6;
  bool promo_notifications = 7;
  bool job_notifications = 8;
}

message GetPreferencesRequest {
  int64 user_id = 1;
}

message GetPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message UpdatePreferencesRequest {
  int64 user_id = 1;
  optional bool push_enabled = 2;
  optional bool sms_enabled = 3;
  optional bool email_enabled = 4;
  optional bool chat_notifications = 5;
  optional bool order_notifications = 6;
  optional bool promo_notifications = 7;
  optional bool job_notifications = 8;
}

message UpdatePreferencesResponse {
  NotificationPreferences preferences = 1;
}

// ============================================================
// Campaigns — admin-driven targeted broadcasts
// ============================================================

// CampaignService provides admin-only RPCs for targeted push campaigns.
// All methods require a valid JWT with platform role "admin"; the role is
// asserted via the x-platform-role gRPC metadata header (set by BFF) and
// re-checked by notification-service itself. Recipient IDs are never accepted
// from the caller — the audience is resolved server-side from CampaignSegment.
service CampaignService {
  // AdminCreateCampaign stores a new campaign in status "draft".
  // Returns INVALID_ARGUMENT when action.route is outside the allowlist or
  // when route "client.url" carries a non-https params["url"].
  rpc AdminCreateCampaign(AdminCreateCampaignRequest) returns (AdminCreateCampaignResponse);

  // AdminUpdateCampaign edits a campaign. Allowed only while status = "draft";
  // otherwise FAILED_PRECONDITION.
  rpc AdminUpdateCampaign(AdminUpdateCampaignRequest) returns (AdminUpdateCampaignResponse);

  // AdminGetCampaign returns one campaign with its progress counters.
  rpc AdminGetCampaign(AdminGetCampaignRequest) returns (AdminGetCampaignResponse);

  // AdminListCampaigns returns a paginated list, newest first, optionally
  // filtered by status.
  rpc AdminListCampaigns(AdminListCampaignsRequest) returns (AdminListCampaignsResponse);

  // AdminPreviewSegment resolves the audience size for a segment without
  // creating or sending anything. Returns only a count, never user data.
  rpc AdminPreviewSegment(AdminPreviewSegmentRequest) returns (AdminPreviewSegmentResponse);

  // AdminSendCampaign transitions draft -> sending and hands the campaign to
  // the background sender. Returns the campaign in its new state; delivery
  // progress is observed via AdminGetCampaign.
  rpc AdminSendCampaign(AdminSendCampaignRequest) returns (AdminSendCampaignResponse);

  // AdminCancelCampaign transitions draft|sending -> cancelled. Messages
  // already handed to the push pipeline are not recalled.
  rpc AdminCancelCampaign(AdminCancelCampaignRequest) returns (AdminCancelCampaignResponse);
}

// CampaignAction is the tap target of the campaign notification. It is carried
// to the client inside the existing versioned push data contract
// (schema "ctogram.push.v1"): route + params are merged into Notification.data.
// route must be one of the server-side allowlist (client.notifications,
// client.purchases, client.request.create, client.request.responses,
// client.parts_request.detail, client.garage, client.home, chat.detail,
// client.url). An unknown route is a safe no-op on the client, so the
// allowlist is enforced at campaign creation time.
message CampaignAction {
  string route = 1;
  // params are route-specific values (e.g. {"request_id": "..."} or
  // {"url": "https://..."} for route "client.url"; https-only, validated).
  map<string, string> params = 2;
}

// CampaignSegment describes the audience. Unset fields are not filtered on;
// set fields are combined with AND. The audience is resolved through the
// owning services (users.ResolveUserSegment, services.request.ListRequestUserIDs)
// and intersected in notification-service — no cross-database joins.
message CampaignSegment {
  // city_id filters by users.city_id (NSI city).
  optional int64 city_id = 1;
  // has_car = true keeps users with at least one car; false keeps users with none.
  optional bool has_car = 2;
  // mark_id keeps users owning a car of this NSI make.
  optional int64 mark_id = 3;
  // has_requests = true keeps users that created at least one request;
  // false keeps users that never created one.
  optional bool has_requests = 4;
}

// Campaign is one admin broadcast and its delivery progress.
message Campaign {
  string id = 1;
  string title = 2;
  string body = 3;
  // category of the produced notifications; defaults to
  // NOTIFICATION_CATEGORY_PROMO when unspecified.
  NotificationCategory category = 4;
  CampaignAction action = 5;
  CampaignSegment segment = 6;
  // status: "draft" | "sending" | "sent" | "cancelled" | "failed".
  string status = 7;
  // total_recipients is the resolved audience size, filled when sending starts.
  int32 total_recipients = 8;
  int32 sent_count = 9;
  int32 failed_count = 10;
  // created_by is the admin user ID taken from the JWT at creation time.
  int64 created_by = 11;
  // error carries the failure reason when status = "failed"; empty otherwise.
  string error = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // started_at / finished_at are unset (null) until the campaign is sent.
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
  // target_apps selects which applications receive this campaign:
  // "client" (cg_client_fapp) and/or "partner" (cg_fapp PRO).
  // Empty means ["client"]. Applied on top of the segment via the existing
  // user_devices.app filter in the push pipeline.
  repeated string target_apps = 17;
  // Optional campaign image rendered in the notification conversation.
  // Must be an absolute HTTPS URL; empty means text-only.
  string image_url = 18;
}

message AdminCreateCampaignRequest {
  string title = 1;
  string body = 2;
  NotificationCategory category = 3;
  CampaignAction action = 4;
  CampaignSegment segment = 5;
  // target_apps: "client" and/or "partner"; empty = ["client"].
  repeated string target_apps = 6;
  string image_url = 7;
}

message AdminCreateCampaignResponse {
  Campaign campaign = 1;
}

message AdminUpdateCampaignRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  NotificationCategory category = 4;
  CampaignAction action = 5;
  CampaignSegment segment = 6;
  // target_apps: "client" and/or "partner"; empty = ["client"].
  repeated string target_apps = 7;
  string image_url = 8;
}

message AdminUpdateCampaignResponse {
  Campaign campaign = 1;
}

message AdminGetCampaignRequest {
  string id = 1;
}

message AdminGetCampaignResponse {
  Campaign campaign = 1;
}

message AdminListCampaignsRequest {
  int32 page = 1;
  int32 page_size = 2;
  // status filters by campaign status; unset = all statuses.
  optional string status = 3;
}

message AdminListCampaignsResponse {
  repeated Campaign campaigns = 1;
  int64 total = 2;
}

message AdminPreviewSegmentRequest {
  CampaignSegment segment = 1;
}

message AdminPreviewSegmentResponse {
  // count is the number of users matching the segment.
  int64 count = 1;
}

message AdminSendCampaignRequest {
  string id = 1;
}

message AdminSendCampaignResponse {
  Campaign campaign = 1;
}

message AdminCancelCampaignRequest {
  string id = 1;
}

message AdminCancelCampaignResponse {
  Campaign campaign = 1;
}
