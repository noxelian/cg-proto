syntax = "proto3";

package payments.payment.v1;

option go_package = "github.com/4ubak/cg-proto/gen/go/payments/payment;paymentv1";

import "google/protobuf/timestamp.proto";

// PaymentService handles payment processing, transactions, refunds, and webhooks.
service PaymentService {
  // === Transactions ===
  // CreateTransaction accepts an authoritative payment intent only from the
  // service that owns entity_type. It is not a human/BFF checkout endpoint.
  // User-facing checkout uses InitPayment + StartPayment so cg-payments can
  // resolve amount and ownership from the entity owner.
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);

  // === Refunds ===
  rpc InitiateRefund(InitiateRefundRequest) returns (InitiateRefundResponse);

  // === Provider webhooks ===
  rpc HandleIokaWebhook(HandleIokaWebhookRequest) returns (HandleIokaWebhookResponse);
  rpc HandleKaspiCheckPay(HandleKaspiCheckPayRequest) returns (HandleKaspiCheckPayResponse);
  // HandleLegacyKaspiCallback receives the authenticated completion callback
  // forwarded by bff-mobile from the temporary legacy banks bridge.
  rpc HandleLegacyKaspiCallback(HandleLegacyKaspiCallbackRequest) returns (HandleLegacyKaspiCallbackResponse);

  // === Admin ===
  rpc GetPaymentAuditLog(GetPaymentAuditLogRequest) returns (GetPaymentAuditLogResponse);

  // MarkPaidB2B records an offline (invoice/cash) payment made on behalf
  // of a legal-entity buyer. Creates a succeeded transaction without
  // calling a provider; emits payment.events with canonical_event_type
  // = payment.success so cg-orders cart consumer treats it identically
  // to B2C online payments. Caller must hold the
  // `payments:admin_mark_paid` permission (enforced at the handler).
  rpc MarkPaidB2B(MarkPaidB2BRequest) returns (MarkPaidB2BResponse);

  // === Combined-pay (cg_web migration) ===

  // ListAvailablePaymentMethods returns only payment routes that are enabled
  // for the requested product flow. It does not create a payment intent.
  rpc ListAvailablePaymentMethods(ListAvailablePaymentMethodsRequest) returns (ListAvailablePaymentMethodsResponse);

  // InitPayment opens the CombinedPayModal: returns selectable payment methods,
  // wallet eligibility, and the session token used by StartPayment.
  rpc InitPayment(InitPaymentRequest) returns (InitPaymentResponse);

  // StartPayment begins the chosen payment option (or settles from wallet).
  rpc StartPayment(StartPaymentRequest) returns (StartPaymentResponse);

  // ConfirmWalletPayment charges an intent already started by StartPayment
  // using a device-wallet token (Apple Pay) instead of the hosted checkout
  // page. The caller supplies only the wallet token: amount, currency and
  // organization were fixed when the provider order was created and must
  // never be re-supplied by transport.
  //
  // It reports what the acquirer answered; it does NOT settle the payment.
  // The durable money state still changes only through the provider webhook,
  // which remains the single authority for transitions, audit rows and outbox
  // events.
  rpc ConfirmWalletPayment(ConfirmWalletPaymentRequest) returns (ConfirmWalletPaymentResponse);

  // === Provider routing (admin) ===

  // ListPaymentProviderRoutes reports which card acquirer serves each product
  // flow right now, plus the flows and acquirers an operator may choose from.
  // Routing is runtime state: it is read from storage, not from the image, so
  // switching an acquirer never requires a release.
  rpc ListPaymentProviderRoutes(ListPaymentProviderRoutesRequest) returns (ListPaymentProviderRoutesResponse);

  // SetPaymentProviderRoute points one product flow at a card acquirer. The
  // caller must hold a platform-admin role, resolved through cg-users.
  rpc SetPaymentProviderRoute(SetPaymentProviderRouteRequest) returns (SetPaymentProviderRouteResponse);
}

// =============================================
// Enums
// =============================================

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_PROCESSING = 2;
  TRANSACTION_STATUS_SUCCEEDED = 3;
  TRANSACTION_STATUS_FAILED = 4;
  TRANSACTION_STATUS_REFUNDED = 5;
  TRANSACTION_STATUS_PARTIALLY_REFUNDED = 6;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_CHARGE = 1;
  TRANSACTION_TYPE_REFUND = 2;
  TRANSACTION_TYPE_ESCROW_HOLD = 3;
  TRANSACTION_TYPE_ESCROW_RELEASE = 4;
}

enum PaymentProvider {
  PAYMENT_PROVIDER_UNSPECIFIED = 0;
  PAYMENT_PROVIDER_IOKA = 1;
  PAYMENT_PROVIDER_KASPI = 2;
  PAYMENT_PROVIDER_FREEDOMPAY = 3;
  // Boxo (bank super-app miniapp platform, docs.boxo.io). SDK-driven: there is
  // no hosted redirect page — CreateTransactionResponse.payment_url carries the
  // Boxo order_payment_id, which the miniapp frontend passes to
  // appboxoSdk.pay(). Terminal status arrives via the Boxo webhook.
  PAYMENT_PROVIDER_BOXO = 4;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_APPLE_PAY = 2;
  PAYMENT_METHOD_GOOGLE_PAY = 3;
  PAYMENT_METHOD_KASPI = 4;
}

// PayEntityType is the canonical entity-type counterpart of the free-form
// `entity_type` string used by InitPayment / StartPayment. Legacy pay_type_id
// values 1-18 are mapped here so the BFF can validate without string compares.
enum PayEntityType {
  PAY_ENTITY_TYPE_UNSPECIFIED = 0;
  PAY_ENTITY_TYPE_ADS = 1;               // legacy PayTypeAds=1
  PAY_ENTITY_TYPE_BASKET = 2;            // legacy PayTypeBasket=2
  PAY_ENTITY_TYPE_HELP_REQUEST = 3;      // legacy PayTypeHelpRequest=3
  PAY_ENTITY_TYPE_TURNKEY = 4;           // legacy PayTypeTurnkey=4
  PAY_ENTITY_TYPE_PAYMENT_REQUEST = 5;   // legacy PayTypePaymentRequest=5
  PAY_ENTITY_TYPE_BANNER = 6;            // legacy PayTypeBanner=6
  PAY_ENTITY_TYPE_AD_PAY_CALL = 7;       // legacy PayTypeAdPayCallRequests=7
  PAY_ENTITY_TYPE_ORDER_WORK = 11;       // legacy PayTypeOrderWork=11 (repair order)
  PAY_ENTITY_TYPE_CHAT_RESPONSE = 12;    // legacy PayTypeChatResponse=12
  PAY_ENTITY_TYPE_MAINTENANCE = 15;      // legacy PayTypeMaintenance=15
  PAY_ENTITY_TYPE_CAR_WASH_AUTO = 16;    // legacy PayTypeCarWashAutoBook=16
  PAY_ENTITY_TYPE_CAR_WASH_BOOKING = 17; // legacy PayTypeCarWash=17
  PAY_ENTITY_TYPE_SUBSCRIPTION = 20;     // new_cg: subscription
  PAY_ENTITY_TYPE_BID_PURCHASE = 21;     // new_cg: bid_purchase
  PAY_ENTITY_TYPE_ORDER = 22;            // new_cg: marketplace order
  PAY_ENTITY_TYPE_BOOKING = 23;          // new_cg: car-wash booking
  PAY_ENTITY_TYPE_CART_CHECKOUT = 24;    // new_cg: cart_checkout
  PAY_ENTITY_TYPE_REPAIR_ORDER = 25;     // new_cg: cg-workshop repair_order
  PAY_ENTITY_TYPE_REQUEST_BID_ESCROW = 26; // request response with held settlement
}

// PayOptionKind is the installment / BNPL flavour of a payment option.
enum PayOptionKind {
  PAY_OPTION_KIND_UNSPECIFIED = 0;
  PAY_OPTION_KIND_CARD = 1;        // ioka card / Apple Pay / Google Pay
  PAY_OPTION_KIND_KASPI = 2;       // Kaspi QR / Kaspi Pay direct
  PAY_OPTION_KIND_INSTALLMENT = 3; // BNPL / kaspi_pay installment
  PAY_OPTION_KIND_WALLET = 4;      // pay from bonus wallet balance
}

// PaymentUseCase scopes provider availability to one product flow. A provider
// can be configured globally but intentionally unavailable for a specific flow.
//
// Clients never send this enum: the mobile BFF derives it from the entity_type
// of GET /mobile/payment/methods, so adding a flow here does not change the
// public HTTP contract.
enum PaymentUseCase {
  PAYMENT_USE_CASE_UNSPECIFIED = 0;
  PAYMENT_USE_CASE_FUELING = 1;
  // Roadside assistance and the dispatched fixed-price services sold through
  // the same order API (POST /roadside/services).
  PAYMENT_USE_CASE_ROADSIDE = 2;
}

// =============================================
// Core messages
// =============================================

message Transaction {
  int64 id = 1;
  string external_id = 2;
  string entity_type = 3;
  int64 entity_id = 4;
  string organization_id = 5;
  int64 user_id = 6;
  int64 amount = 7;
  string currency = 8;
  int64 commission_amount = 9;
  PaymentProvider provider = 10;
  PaymentMethod payment_method = 11;
  TransactionStatus status = 12;
  TransactionType type = 13;
  string idempotency_key = 14;
  google.protobuf.Timestamp paid_at = 15;
  string failure_reason = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message Refund {
  int64 id = 1;
  int64 transaction_id = 2;
  string external_id = 3;
  int64 amount = 4;
  string reason = 5;
  string status = 6;
  string initiated_by = 7;
  int64 initiator_id = 8;
  google.protobuf.Timestamp created_at = 9;
}

message AuditLogEntry {
  int64 id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  string action = 4;
  string old_status = 5;
  string new_status = 6;
  string actor_type = 7;
  string actor_id = 8;
  google.protobuf.Timestamp created_at = 9;
}

// =============================================
// CreateTransaction — owner-service authoritative payment intent
// =============================================

message CreateTransactionRequest {
  // cg-payments binds each entity_type to one signed service identity. The
  // current owner-service paths are cg-orders -> cart_checkout/fueling_order.
  string entity_type = 1;
  int64 entity_id = 2;
  string organization_id = 3;
  int64 user_id = 4;            // authoritative payer selected by the owner service
  int64 amount = 5;             // authoritative amount in minor units (tiyn for KZT)
  string currency = 6;
  PaymentProvider provider = 7;
  PaymentMethod payment_method = 8;
  string idempotency_key = 9;
  int64 commission_amount = 10;
  string return_url = 11;       // optional HTTPS redirect URL after payment (must be HTTPS, no private IPs)
  // settlement_mode decides where a successful payment lands. Unspecified is
  // the direct path every existing caller already gets, so adding this field
  // changes nothing for them.
  SettlementMode settlement_mode = 12;
}

// SettlementMode selects how cg-billing posts a captured payment.
enum SettlementMode {
  // Direct: credit the recipient organization immediately. This is the
  // historical behaviour and stays the default for every caller.
  SETTLEMENT_MODE_UNSPECIFIED = 0;
  SETTLEMENT_MODE_DIRECT = 1;
  // Escrow: hold the money on the platform until the payer (or an admin on
  // their behalf) confirms delivery, then release it minus commission.
  SETTLEMENT_MODE_ESCROW = 2;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
  string payment_url = 2;
}

// =============================================
// ListTransactions / GetTransaction
// =============================================

message ListTransactionsRequest {
  string organization_id = 1;
  int64 user_id = 2;
  string entity_type = 3;
  TransactionStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

message GetTransactionRequest {
  int64 transaction_id = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

// =============================================
// Refund
// =============================================

message InitiateRefundRequest {
  int64 transaction_id = 1;
  int64 amount = 2;
  string reason = 3;
  int64 initiator_id = 4;
}

message InitiateRefundResponse {
  Refund refund = 1;
}

// =============================================
// Webhooks
// =============================================

message HandleIokaWebhookRequest {
  bytes raw_body = 1;
  map<string, string> headers = 2;
}

message HandleIokaWebhookResponse {
  bool success = 1;
}

message HandleKaspiCheckPayRequest {
  string command = 1;
  string txn_id = 2;
  string account = 3;
  string sum = 4;
  string txn_date = 5;
}

message HandleKaspiCheckPayResponse {
  string xml_response = 1;
}

message HandleLegacyKaspiCallbackRequest {
  string account = 1;
  string signature = 2;
}

message HandleLegacyKaspiCallbackResponse {
  bool success = 1;
}

// =============================================
// Audit log
// =============================================

message GetPaymentAuditLogRequest {
  string entity_type = 1;
  int64 entity_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetPaymentAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  int32 total = 2;
}

// =============================================
// B2B Mark-Paid (admin-driven offline payments)
// =============================================

message MarkPaidB2BRequest {
  // entity_type + entity_id identify the payable resource (e.g.
  // "marketplace_order"+order_id). Mirrors CreateTransactionRequest so
  // downstream consumers see the same envelope as B2C events.
  string entity_type = 1;
  int64 entity_id = 2;
  string organization_id = 3;
  // user_id of the buyer (the legal entity's contact), 0 if not bound.
  int64 user_id = 4;
  int64 amount = 5;          // tiyn
  string currency = 6;       // default KZT
  string idempotency_key = 7; // typically "{checkout_id}" or "b2b:{order_id}"
  // payment_method = "invoice" | "cash"
  string payment_method = 8;
  string invoice_number = 9;  // optional, required when payment_method=invoice
  string notes = 10;          // free-form audit note
}

message MarkPaidB2BResponse {
  Transaction transaction = 1;
  // idempotent=true when the request matched an existing succeeded
  // transaction (replay). The caller can use this to suppress duplicate
  // side effects on its own side.
  bool idempotent = 2;
}

// =============================================
// Combined-pay (cg_web migration)
// =============================================

message ListAvailablePaymentMethodsRequest {
  PaymentUseCase use_case = 1;
}

message AvailablePaymentMethod {
  string id = 1;             // provider key: "ioka" | "kaspi"
  string payment_method = 2; // exact value accepted by the product order API
  string title = 3;
  string sub_title = 4;
  string cashback_title = 5;
  string icon_url = 6;
  PayOptionKind kind = 7;
  // Cashback the payer earns on this route, in whole percent (5 = 5%). Zero
  // means no cashback and clients must not render one.
  //
  // The rate is a product decision that changes without an app release, so it
  // belongs here rather than in a client constant. It is per route, so one
  // provider may carry a different rate in a different product flow.
  int32 cashback_percent = 8;
}

message ListAvailablePaymentMethodsResponse {
  repeated AvailablePaymentMethod payment_methods = 1;
}

// PayOption is a single selectable payment method shown in CombinedPayModal.
message PayOption {
  string id = 1;             // provider key: "ioka", "kaspi", "kaspi_pay", "wallet"
  string title = 2;          // display name shown in UI
  string sub_title = 3;      // e.g. "моментальная оплата"
  string cashback_title = 4; // e.g. "5% бонусов"
  string icon_url = 5;       // absolute URL to bank/provider logo
  PayOptionKind kind = 6;
  // Opaque token the client passes back in StartPaymentRequest.pay_session_token
  // to identify this option. Encodes entity_type + entity_id + provider +
  // idempotency_key without leaking internal IDs in plain text.
  string pay_session_token = 7;
  // Cashback the payer earns on this option, in whole percent (5 = 5%). Zero
  // means none. Same product-owned rate as
  // AvailablePaymentMethod.cashback_percent: combined-pay flows (escrow, cart,
  // invoices, banners) must show the same promise as the product checkouts.
  int32 cashback_percent = 8;
}

message InitPaymentRequest {
  PayEntityType entity_type = 1;
  int64 entity_id = 2; // Required positive ID resolved by the entity owner.
  // Deprecated request financial facts. cg-payments ignores these fields and
  // resolves amount, currency and organization from the owning service before
  // minting a pay-session token.
  int64 amount = 3 [deprecated = true];
  string currency = 4 [deprecated = true];
  // Deprecated identity copy. The verified JWT is authoritative.
  int64 user_id = 5 [deprecated = true];
  // Deprecated legacy CombinedPayModel context; cg-payments ignores it.
  string city = 6 [deprecated = true];
  string phone = 7 [deprecated = true];
  string note = 8 [deprecated = true];
  int64 delivery_amount = 9 [deprecated = true];
}

message InitPaymentResponse {
  // available_options are the standard (non-installment) methods (FE available_banks[]).
  repeated PayOption available_options = 1;
  // installment_options are BNPL / kaspi_pay entries (FE loan_from_bank[]).
  repeated PayOption installment_options = 2;
  // wallet_eligible is true when the user has a positive wallet balance (FE from_account).
  bool wallet_eligible = 3;
  // wallet_balance_tiyn is the current deductible wallet balance; 0 when ineligible.
  int64 wallet_balance_tiyn = 4;
  // total_amount_tiyn is the authoritative amount resolved by the entity owner.
  int64 total_amount_tiyn = 5;
}

message StartPaymentRequest {
  // pay_session_token was returned in InitPaymentResponse.PayOption.pay_session_token.
  string pay_session_token = 1;
  // use_wallet_balance: true when the user toggled "Потратить бонусы".
  bool use_wallet_balance = 2;
  // wallet_apply_amount is the tiyn amount to deduct; capped at min(balance, total).
  int64 wallet_apply_amount = 3;
  // return_url is the deep-link / HTTPS URL the provider redirects to after payment.
  string return_url = 4;
}

message StartPaymentResponse {
  // payment_url is the provider checkout URL; empty when fully settled from wallet.
  string payment_url = 1;
  // installment_url is set instead of payment_url for BNPL options.
  string installment_url = 2;
  // transaction_id is the newly created or idempotently returned transaction.
  int64 transaction_id = 3;
  // wallet_debited_tiyn is the amount actually deducted from the wallet.
  int64 wallet_debited_tiyn = 4;
  // fully_paid_from_wallet=true means the wallet covered the full amount.
  bool fully_paid_from_wallet = 5;
}

message ConfirmWalletPaymentRequest {
  // transaction_id is the intent returned by StartPayment.
  int64 transaction_id = 1;
  // wallet_token is the device wallet payload as JSON, forwarded to the
  // acquirer byte-for-byte. For Apple Pay this is the PKPaymentToken:
  // {"paymentData":{...},"paymentMethod":{...},"transactionIdentifier":"..."}.
  // It is opaque on purpose — re-modelling Apple's schema in proto would only
  // create a place to silently drop a field, and any re-encoding of the
  // encrypted payload invalidates its signature.
  string wallet_token = 2;
}

message ConfirmWalletPaymentResponse {
  int64 transaction_id = 1;
  // provider_status is the acquirer's payment status, passed through
  // untranslated (APPROVED, CAPTURED, DECLINED, REQUIRES_ACTION, PENDING).
  string provider_status = 2;
  // succeeded is true only when the funds are authorized or taken.
  // REQUIRES_ACTION and PENDING are explicitly NOT success.
  bool succeeded = 3;
  // action_url is the 3-D Secure step the payer must still complete. When it
  // is set the payment is unfinished, whatever provider_status says.
  string action_url = 4;
  // decline_reason is the acquirer's decline code, safe to show the payer.
  string decline_reason = 5;
}

// =============================================
// Credit (FFC2 — Freedom Finance Credit conveyor)
// =============================================

// CreditService submits and tracks FFC2 credit/installment applications
// (apply-lead-factoring) and their refunds (factoring-refund). Amounts are
// tiyn everywhere in this API; cg-payments converts to tenge at the FFC
// adapter boundary. Application/refund outcomes arrive asynchronously via
// the FFC hook and are published as `credit.*` payment events.
service CreditService {
  // CreateCreditApplication accepts an authoritative credit intent only from
  // the service that owns entity_type (owner-service mapping, like
  // PaymentService.CreateTransaction). It creates the local application row
  // first, then submits the FFC lead and binds uuid + redirect_url.
  rpc CreateCreditApplication(CreateCreditApplicationRequest) returns (CreateCreditApplicationResponse);
  // GetCreditApplication resolves by FFC uuid or by (entity_type, entity_id).
  rpc GetCreditApplication(GetCreditApplicationRequest) returns (GetCreditApplicationResponse);
  // RefundCreditApplication initiates a full or partial refund for an ISSUED
  // application. The result is asynchronous (FFC hook, covlir_status).
  rpc RefundCreditApplication(RefundCreditApplicationRequest) returns (RefundCreditApplicationResponse);

  // === Cession (assignment of claims) ===
  // The bank buys the partner's claims on the loans it issued each business
  // day. Per the FFC2 contract we send one signed assignment agreement per
  // issue date, every day except weekends; Friday/Saturday/Sunday are sent on
  // Monday as three separate submissions.

  // ListCessionLoans returns the loans issued on issue_date under our partner
  // id together with the exact total the bank will validate. Use it to render
  // the assignment agreement document.
  rpc ListCessionLoans(ListCessionLoansRequest) returns (ListCessionLoansResponse);
  // SubmitCessionAgreement signs the supplied PDF with the partner EDS key and
  // posts it to the conveyor. The final outcome arrives asynchronously on the
  // partner-wide cession hook.
  rpc SubmitCessionAgreement(SubmitCessionAgreementRequest) returns (SubmitCessionAgreementResponse);
  rpc GetCessionAgreement(GetCessionAgreementRequest) returns (GetCessionAgreementResponse);

  // === Goods loan (bank-issued installment / credit) ===

  // ListPartnerProducts returns the bank products available to us with their
  // amount ranges and allowed periods, so the storefront can offer only terms
  // the conveyor will accept.
  rpc ListPartnerProducts(ListPartnerProductsRequest) returns (ListPartnerProductsResponse);
  // RefreshCreditApplicationStatus pulls the conveyor's current status for a
  // goods-loan application. Hooks remain the primary signal; this is the
  // recovery path when a hook is lost.
  rpc RefreshCreditApplicationStatus(RefreshCreditApplicationStatusRequest) returns (RefreshCreditApplicationStatusResponse);
}

enum CreditApplicationStatus {
  CREDIT_APPLICATION_STATUS_UNSPECIFIED = 0;
  // Local row persisted, FFC lead not yet accepted.
  CREDIT_APPLICATION_STATUS_PENDING = 1;
  // FFC accepted the lead; the client is passing scoring at redirect_url.
  CREDIT_APPLICATION_STATUS_SCORING = 2;
  CREDIT_APPLICATION_STATUS_ISSUED = 3;
  CREDIT_APPLICATION_STATUS_REJECTED = 4;
  CREDIT_APPLICATION_STATUS_PARTIALLY_REFUNDED = 5;
  CREDIT_APPLICATION_STATUS_REFUNDED = 6;
  // Scoring approved the requested terms; the loan is not issued yet.
  CREDIT_APPLICATION_STATUS_APPROVED = 7;
  // Scoring offered different terms (smaller principal and/or another
  // period). The customer continues without a new application; when the
  // approved principal is below the basket the difference is paid at the till.
  CREDIT_APPLICATION_STATUS_ALTERNATIVE = 8;
}

// CreditProductKind selects which FFC2 product a request belongs to. The two
// products are separate integrations that share only authentication and the
// hook contract.
enum CreditProductKind {
  // Treated as FACTORING so existing callers keep their behaviour.
  CREDIT_PRODUCT_KIND_UNSPECIFIED = 0;
  // apply-lead-factoring: we issue the installment, sign the print forms and
  // later assign the claim to the bank through the daily cession.
  CREDIT_PRODUCT_KIND_FACTORING = 1;
  // goods-loan-lead: the bank lends directly. No print forms, no partner
  // contract number, no cession and no refund method.
  CREDIT_PRODUCT_KIND_GOODS_LOAN = 2;
}

// CreditLoanType mirrors the bank's `loan_type` field.
enum CreditLoanType {
  CREDIT_LOAN_TYPE_UNSPECIFIED = 0;
  CREDIT_LOAN_TYPE_INSTALLMENT = 1; // рассрочка
  CREDIT_LOAN_TYPE_CREDIT = 2;      // кредит
}

// CreditApprovedParams carries the terms scoring actually approved. Amounts are
// tiyn; rates are basis points (1.5% -> 150) so no float reaches the wire.
message CreditApprovedParams {
  int64 principal_tiyn = 1;
  int32 period_months = 2;
  int32 interest_rate_bp = 3;
  int32 effective_rate_bp = 4;
  int64 monthly_payment_tiyn = 5;
}

enum CreditRefundType {
  CREDIT_REFUND_TYPE_UNSPECIFIED = 0;
  CREDIT_REFUND_TYPE_FULL = 1;    // FFC "REFUND"
  CREDIT_REFUND_TYPE_PARTIAL = 2; // FFC "PARTIAL_REFUND" — amount must be < principal
}

// CreditPrintForm is an OTP-signed document already hosted by the caller.
message CreditPrintForm {
  // name: "application" (заявление о присоединении) or "notification"
  // (уведомление о переходе прав) per the FFC2 partner contract.
  string name = 1;
  // url of the signed document; must be HTTPS.
  string url = 2;
}

message CreditGood {
  int64 cost_tiyn = 1;
  string good_identifier = 2;
  int32 quantity = 3;
  string brand = 4;
  string model = 5;
  string category = 6;
}

message CreateCreditApplicationRequest {
  string entity_type = 1;
  int64 entity_id = 2;
  // user_id is the buyer resolved by the owner service, not caller-supplied UI data.
  int64 user_id = 3;
  // iin is the client's 12-digit IIN. Stored masked; never logged.
  string iin = 4;
  // mobile_phone in +7XXXXXXXXXX format.
  string mobile_phone = 5;
  int32 period_months = 6;
  int64 principal_tiyn = 7;
  int64 prepayment_tiyn = 8;
  repeated CreditPrintForm print_forms = 9;
  repeated CreditGood goods = 10;
  // success_url / failure_url are where FFC redirects the client after scoring.
  string success_url = 11;
  string failure_url = 12;
  string delivery_address = 13;
  string reference_id = 14;
  // idempotency_key follows the transaction idempotency contract: replays with
  // a different intent tuple return ALREADY_EXISTS.
  string idempotency_key = 15;
  string seller_name = 16;
  string seller_iin = 17;
  string store_address = 18;
  string store_city = 19;
  // product_kind selects the FFC2 product. FACTORING (the default) requires
  // print_forms; GOODS_LOAN rejects them because the bank owns that paperwork.
  CreditProductKind product_kind = 20;
  // product_id is the bank product selected from ListPartnerProducts. Required
  // for GOODS_LOAN; FACTORING falls back to the configured product.
  string product_id = 21;
}

message CreditApplication {
  // uuid is the FFC conveyor application id; empty until the lead is bound.
  string uuid = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  int64 user_id = 4;
  CreditApplicationStatus status = 5;
  // redirect_url sends the client to the FFC scoring page (SCORING only).
  string redirect_url = 6;
  int64 principal_tiyn = 7;
  int32 period_months = 8;
  int64 refunded_amount_tiyn = 9;
  // credit_contract is the partner-side contract number generated by cg-payments.
  string credit_contract = 10;
  string reference_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  CreditProductKind product_kind = 14;
  CreditLoanType loan_type = 15;
  // approved_params is populated from the APPROVED / ALTERNATIVE / ISSUED
  // hooks. Until scoring answers it carries the requested terms only.
  CreditApprovedParams approved_params = 16;
  // alternative_reason explains why scoring offered different terms.
  string alternative_reason = 17;
  // bank_credit_contract is the conveyor's own contract number (FCT26-...),
  // distinct from the partner-side credit_contract we generate for factoring.
  string bank_credit_contract = 18;
  // bank_status is the raw conveyor status from the status endpoint
  // (NEW, IN_PROGRESS, ON_SIGNING, STATEMENT, HOLD_BEFORE_ISSUED,
  // READY_FOR_ISSUE, ...). Informational: our own lifecycle stays coarse.
  string bank_status = 19;
  // status_reason is the bank's rejection reason (REJECTED only).
  string status_reason = 20;
}

message CreateCreditApplicationResponse {
  CreditApplication application = 1;
}

message GetCreditApplicationRequest {
  // Either uuid or the (entity_type, entity_id) pair must be set.
  string uuid = 1;
  string entity_type = 2;
  int64 entity_id = 3;
}

message GetCreditApplicationResponse {
  CreditApplication application = 1;
}

message RefundCreditApplicationRequest {
  string uuid = 1;
  CreditRefundType refund_type = 2;
  int64 refund_amount_tiyn = 3;
  string idempotency_key = 4;
}

message RefundCreditApplicationResponse {
  // application reflects the local state after the refund was accepted by FFC
  // (refund completion arrives later via the hook).
  CreditApplication application = 1;
}

enum CessionAgreementStatus {
  CESSION_AGREEMENT_STATUS_UNSPECIFIED = 0;
  // Loans for the date are aggregated locally; the signed document has not
  // been submitted yet.
  CESSION_AGREEMENT_STATUS_PENDING = 1;
  // Accepted by the conveyor (HTTP 200); waiting for the cession hook.
  CESSION_AGREEMENT_STATUS_SUBMITTED = 2;
  CESSION_AGREEMENT_STATUS_CONFIRMED = 3;
  CESSION_AGREEMENT_STATUS_FAILED = 4;
}

// CessionLoan is one issued credit application included in a day's assignment.
message CessionLoan {
  string uuid = 1;
  string credit_contract = 2;
  string entity_type = 3;
  int64 entity_id = 4;
  int64 user_id = 5;
  int64 principal_tiyn = 6;
  // iin_masked never carries the full IIN.
  string iin_masked = 7;
  google.protobuf.Timestamp issued_at = 8;
}

message ListCessionLoansRequest {
  // issue_date is the loan issue date in YYYY-MM-DD (Asia/Almaty).
  string issue_date = 1;
}

message ListCessionLoansResponse {
  repeated CessionLoan loans = 1;
  // total_amount_tiyn is the authoritative sum the bank validates against.
  int64 total_amount_tiyn = 2;
  CessionAgreement agreement = 3;
}

message CessionAgreement {
  string issue_date = 1;
  string contract_number = 2;
  string signing_date = 3;
  CessionAgreementStatus status = 4;
  int64 total_amount_tiyn = 5;
  int32 loan_count = 6;
  // document_sha256 binds the submitted PDF to this record.
  string document_sha256 = 7;
  string failure_reason = 8;
  google.protobuf.Timestamp submitted_at = 9;
  google.protobuf.Timestamp confirmed_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message SubmitCessionAgreementRequest {
  string issue_date = 1;
  string contract_number = 2;
  // signing_date is YYYY-MM-DD; defaults to today when empty.
  string signing_date = 3;
  // document_pdf is the rendered assignment agreement. cg-payments signs it
  // with the partner EDS key — never accept a caller-supplied signature.
  bytes document_pdf = 4;
  // expected_total_tiyn is an optional cross-check: a mismatch with the
  // locally aggregated total aborts before contacting the bank.
  int64 expected_total_tiyn = 5;
}

message SubmitCessionAgreementResponse {
  CessionAgreement agreement = 1;
}

message GetCessionAgreementRequest {
  // Either issue_date or contract_number must be set.
  string issue_date = 1;
  string contract_number = 2;
}

message GetCessionAgreementResponse {
  CessionAgreement agreement = 1;
}

// =============================================
// Goods loan (product 2) messages
// =============================================

// CreditRepaymentBand is one amount range and the periods allowed inside it.
message CreditRepaymentBand {
  int64 min_amount_tiyn = 1;
  int64 max_amount_tiyn = 2;
  repeated int32 periods_months = 3;
}

message CreditPartnerProduct {
  string product_id = 1;
  // repayment_method is the bank's raw value: ANNUITY / EQUAL_INSTALMENTS
  // mean a credit, INSTALMENT means a 0% installment.
  string repayment_method = 2;
  CreditLoanType loan_type = 3;
  repeated CreditRepaymentBand repayment = 4;
}

message ListPartnerProductsRequest {
  // amount_tiyn optionally filters bands to those covering this amount.
  int64 amount_tiyn = 1;
}

message ListPartnerProductsResponse {
  string partner_id = 1;
  string partner_name = 2;
  repeated CreditPartnerProduct products = 3;
}

message RefreshCreditApplicationStatusRequest {
  string uuid = 1;
}

message RefreshCreditApplicationStatusResponse {
  CreditApplication application = 1;
}

// =============================================
// Provider routing (admin)
// =============================================

// PaymentProviderRoute binds one product flow to the card acquirer that serves
// it. Only competing card acquirers are routed this way; wallet-style
// providers (Kaspi, Boxo, FFC) are selected by method/audience and are not
// affected by a route.
message PaymentProviderRoute {
  // flow is the payable flow key, e.g. "fueling" or "roadside". The reserved
  // key "default" applies to every flow without a row of its own.
  string flow = 1;
  // provider is the first acquirer of `providers`, kept for wire compatibility
  // with the single-acquirer release. Read `providers`.
  string provider = 2 [deprecated = true];
  // source reports where the effective value comes from: "runtime" (stored and
  // editable), "default" (inherited from the "default" route) or "builtin"
  // (compiled fallback used while nothing is stored).
  string source = 3;
  google.protobuf.Timestamp updated_at = 4;
  int64 updated_by = 5;
  // providers are the providers serving this flow, in the order the checkout
  // offers them. More than one means the payer picks.
  repeated string providers = 6;
  // supported_providers is the TECHNICAL limit of this flow: providers it can
  // be served by at all. A provider outside this list cannot be selected —
  // e.g. fueling cannot take Kaspi, whose failed orders cannot be refunded
  // automatically. The panel shows the difference as unavailable.
  repeated string supported_providers = 7;
  // is_global marks the reserved "default" row: the one switch that applies to
  // every service without an exception of its own.
  bool is_global = 8;
}

message ListPaymentProviderRoutesRequest {}

message ListPaymentProviderRoutesResponse {
  // routes carries one entry per known flow, always resolved to the value in
  // force, so an operator never has to guess what an absent row means.
  repeated PaymentProviderRoute routes = 1;
  // supported_providers lists the acquirers a route may be pointed at.
  repeated string supported_providers = 2;
  // unavailable_providers are supported acquirers that carry no credentials in
  // this environment. Pointing a flow at one would take that flow's checkout
  // down, so the UI must show them as not selectable.
  repeated string unavailable_providers = 3;
}

message SetPaymentProviderRouteRequest {
  string flow = 1;
  // provider sets a single acquirer. Kept for the earlier release; prefer
  // `providers`. Ignored when `providers` is non-empty.
  string provider = 2 [deprecated = true];
  // providers replaces the whole set for this flow, in offer order. An empty
  // list clears the route so the flow falls back to configuration.
  repeated string providers = 3;
}

message SetPaymentProviderRouteResponse {
  PaymentProviderRoute route = 1;
}
