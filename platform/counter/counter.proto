syntax = "proto3";

package platform.counter.v1;

option go_package = "github.com/4ubak/cg-proto/gen/go/platform/counter;counterv1";

service CounterService {
  rpc GetCounters(GetCountersRequest) returns (GetCountersResponse);
  rpc IncrementCounter(IncrementCounterRequest) returns (IncrementCounterResponse);
  rpc DecrementCounter(DecrementCounterRequest) returns (DecrementCounterResponse);
  rpc SetCounter(SetCounterRequest) returns (SetCounterResponse);
  rpc GetBadgeTotal(GetBadgeTotalRequest) returns (GetBadgeTotalResponse);
  // GetRoadsidePurchasesSnapshot returns a counter-owned, monotonic cursor for
  // one purchases filter. Unlike wall-clock timestamps it is safe across hosts.
  rpc GetRoadsidePurchasesSnapshot(GetRoadsidePurchasesSnapshotRequest) returns (GetRoadsidePurchasesSnapshotResponse);
  // ResetRoadsidePurchasesUnread marks changes through a counter-issued cursor
  // as viewed for one filter. The authenticated user may only reset their own.
  rpc ResetRoadsidePurchasesUnread(ResetRoadsidePurchasesUnreadRequest) returns (ResetRoadsidePurchasesUnreadResponse);
}

enum RoadsidePurchasesState {
  ROADSIDE_PURCHASES_STATE_UNSPECIFIED = 0;
  ROADSIDE_PURCHASES_STATE_ACTIVE = 1;
  ROADSIDE_PURCHASES_STATE_COMPLETED = 2;
}

// CounterApp separates badge state for the Client and PRO applications.
enum CounterApp {
  COUNTER_APP_UNSPECIFIED = 0;
  COUNTER_APP_CLIENT = 1;
  COUNTER_APP_PRO = 2;
}

// CounterPerspective separates buyer and seller profile projections for one
// authenticated user. A single user can therefore address CLIENT+BUYER,
// PRO+BUYER_ORG, and PRO+SELLER_ORG as independent scopes; user_id alone never
// selects a profile.
enum CounterPerspective {
  COUNTER_PERSPECTIVE_UNSPECIFIED = 0;
  COUNTER_PERSPECTIVE_BUYER = 1;
  COUNTER_PERSPECTIVE_SELLER_ORG = 2;
  COUNTER_PERSPECTIVE_SELLER_USER = 3;
  COUNTER_PERSPECTIVE_SUPPORT = 4;
  // PRO organization purchasing parts, isolated from Client and supplier state.
  COUNTER_PERSPECTIVE_BUYER_ORG = 5;
}

// CounterScope binds app, perspective, organization, and membership generation
// into one tuple. membership_version is 0 iff organization_id is empty. For an
// organization scope the owner validates the positive version against the
// source membership record, so removal/rehire or a late event cannot reuse an
// older seller-org scope. Legacy parallel fields remain migration inputs only
// and never override or supply a detached membership version.
message CounterScope {
  CounterApp app = 1;
  CounterPerspective perspective = 2;
  string organization_id = 3;
  int64 membership_version = 4;
}

message OrganizationUnreadProjection {
  string organization_id = 1;
  int32 unread_messages = 2;
  int32 unread_notifications = 3;
  int32 total = 4;
  map<string, int32> breakdown = 5;
}

message UserCounters {
  int64 user_id = 1;
  int32 unread_messages = 2;
  int32 unread_notifications = 3;
  int32 active_ads = 4;
  int32 favorites = 5;
  int32 pending_orders = 6;
  int32 new_applications = 7;
  int32 roadside_purchases_unread = 8;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; BFF-selected fields are never authority.
message GetCountersRequest {
  int64 user_id = 1;
  CounterApp app = 2;
  CounterPerspective perspective = 3;
  repeated string organization_ids = 4;
  repeated CounterScope scopes = 5;
}

message GetCountersResponse {
  UserCounters counters = 1;
  repeated OrganizationUnreadProjection organization_unread = 2;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; request fields are never authority.
//
// The synchronous push-badge path is reserved for the exact authenticated notification-service identity
// (a pure service JWT, not a delegated user).
// That path requires exactly one fully specified scopes tuple, a positive delta and an allowlisted unread counter.
// For an organization scope the owner revalidates organization membership immediately before mutation.
// A missing event_id is denied on this service path. Counter mutation, event deduplication,
// and calculation of the exact-scope aggregate badge are one atomic operation.
// An asynchronous Kafka replay carrying the same event_id must hit the same idempotency record
// rather than incrementing again.
message IncrementCounterRequest {
  int64 user_id = 1;
  string counter_name = 2;
  int32 delta = 3;
  CounterApp app = 4;
  CounterPerspective perspective = 5;
  repeated string organization_ids = 6;
  repeated CounterScope scopes = 7;
  // Stable producer event identifier. It is mandatory for the authenticated
  // notification-service path and is reused unchanged by the async Kafka path.
  string event_id = 8;
}

message IncrementCounterResponse {
  int32 new_value = 1;
  // Exact-scope aggregate after the idempotent mutation. The counter service
  // atomically returns badge_total so FCM never needs a racy follow-up read.
  int32 badge_total = 2;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; request fields are never authority.
message DecrementCounterRequest {
  int64 user_id = 1;
  string counter_name = 2;
  int32 delta = 3;
  CounterApp app = 4;
  CounterPerspective perspective = 5;
  repeated string organization_ids = 6;
  repeated CounterScope scopes = 7;
}

message DecrementCounterResponse {
  int32 new_value = 1;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; request fields are never authority.
message SetCounterRequest {
  int64 user_id = 1;
  string counter_name = 2;
  int32 value = 3;
  CounterApp app = 4;
  CounterPerspective perspective = 5;
  repeated string organization_ids = 6;
  repeated CounterScope scopes = 7;
}

message SetCounterResponse {
  bool success = 1;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; BFF-selected fields are never authority.
message GetRoadsidePurchasesSnapshotRequest {
  RoadsidePurchasesState state = 1;
  CounterApp app = 2;
  CounterPerspective perspective = 3;
  repeated string organization_ids = 4;
  repeated CounterScope scopes = 5;
}

message GetRoadsidePurchasesSnapshotResponse {
  // Opaque per-user sequence. Clients must only return it to the reset RPC.
  uint64 cursor = 1;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; BFF-selected fields are never authority.
message ResetRoadsidePurchasesUnreadRequest {
  RoadsidePurchasesState state = 1;
  // Cursor previously issued by GetRoadsidePurchasesSnapshot.
  uint64 cursor = 2;
  CounterApp app = 3;
  CounterPerspective perspective = 4;
  repeated string organization_ids = 5;
  repeated CounterScope scopes = 6;
}

message ResetRoadsidePurchasesUnreadResponse {
  bool success = 1;
  int32 roadside_purchases_unread = 2;
  // Remaining unread changes in the filter selected by the request.
  int32 state_unread = 3;
}

// app, perspective, and organization_ids are routing/profile context only.
// The owner/BFF MUST bind app to the verified JWT app, reject a caller-scoped
// app mismatch, and validate organization membership/ownership with the source
// owner; BFF-selected fields are never authority.
message GetBadgeTotalRequest {
  int64 user_id = 1;
  CounterApp app = 2;
  CounterPerspective perspective = 3;
  repeated string organization_ids = 4;
  repeated CounterScope scopes = 5;
}

message GetBadgeTotalResponse {
  int32 total = 1; // min(cap, сумма max(0,src)); кап на чтении
  map<string, int32> breakdown = 2; // без капа
  repeated OrganizationUnreadProjection organization_unread = 3;
}
